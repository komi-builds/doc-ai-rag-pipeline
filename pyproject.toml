[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ragharness"
version = "0.1.0"
description = "Token-efficient RAG harness for Claude"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.125",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag = "ragharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
